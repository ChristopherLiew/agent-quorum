<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" width="960" height="330" role="img" aria-label="Two agent sessions want the same file. agent-quorum lets the first edit it and blocks the second, which is told who holds the file.">
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .title { font-size: 19px; font-weight: 600; fill: #f1f5f9; }
    .sub { font-size: 14.5px; fill: #94a3b8; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 14px; }
    .wire { stroke: #475569; stroke-width: 3; fill: none; stroke-linecap: round; }
  </style>
  <defs>
    <marker id="tip" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M1 1 L9 5 L1 9" fill="none" stroke="#475569" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect width="960" height="330" rx="22" fill="#111827"/>

  <!-- Session A -->
  <rect x="36" y="48" width="262" height="96" rx="16" fill="#1e293b" stroke="#2dd4bf" stroke-width="2"/>
  <rect x="58" y="74" width="44" height="34" rx="7" fill="none" stroke="#2dd4bf" stroke-width="2.5"/>
  <path d="M68 85 l8 6 l-8 6 M82 98 h10" fill="none" stroke="#2dd4bf" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="120" y="88" class="title">Session A</text>
  <text x="120" y="112" class="sub">edits <tspan class="mono" fill="#e2e8f0">auth.go</tspan></text>

  <!-- Session B -->
  <rect x="36" y="186" width="262" height="96" rx="16" fill="#1e293b" stroke="#94a3b8" stroke-width="2"/>
  <rect x="58" y="212" width="44" height="34" rx="7" fill="none" stroke="#94a3b8" stroke-width="2.5"/>
  <path d="M68 223 l8 6 l-8 6 M82 236 h10" fill="none" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="120" y="226" class="title">Session B</text>
  <text x="120" y="250" class="sub">wants <tspan class="mono" fill="#e2e8f0">auth.go</tspan> too</text>

  <!-- wires in -->
  <path class="wire" d="M298 96 C350 96 360 150 410 158" marker-end="url(#tip)"/>
  <path class="wire" d="M298 234 C350 234 360 180 410 172" marker-end="url(#tip)"/>

  <!-- agent-quorum -->
  <circle cx="480" cy="165" r="68" fill="#0b1220" stroke="#334155" stroke-width="2"/>
  <g stroke="#475569" stroke-width="5" stroke-linecap="round">
    <line x1="480" y1="128" x2="448" y2="188"/>
    <line x1="480" y1="128" x2="512" y2="188"/>
    <line x1="448" y1="188" x2="512" y2="188"/>
  </g>
  <circle cx="480" cy="128" r="15" fill="#2dd4bf"/>
  <circle cx="448" cy="188" r="15" fill="#2dd4bf"/>
  <circle cx="512" cy="188" r="13" fill="#0b1220" stroke="#94a3b8" stroke-width="4"/>
  <path d="M468 167 l9 9 l15 -18" fill="none" stroke="#f1f5f9" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="480" y="262" text-anchor="middle" class="title">agent-quorum</text>
  <text x="480" y="284" text-anchor="middle" class="sub">one holder per file</text>

  <!-- wires out -->
  <path class="wire" d="M550 158 C600 150 610 96 656 96" marker-end="url(#tip)"/>
  <path class="wire" d="M550 172 C600 180 610 234 656 234" marker-end="url(#tip)"/>

  <!-- allowed -->
  <rect x="662" y="48" width="262" height="96" rx="16" fill="#0f2a27" stroke="#2dd4bf" stroke-width="2"/>
  <circle cx="702" cy="96" r="20" fill="#2dd4bf"/>
  <path d="M692 97 l7 7 l12 -14" fill="none" stroke="#0f2a27" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="736" y="90" class="title">Edit goes ahead</text>
  <text x="736" y="113" class="sub">A now holds the file</text>

  <!-- blocked -->
  <rect x="662" y="186" width="262" height="96" rx="16" fill="#2a1418" stroke="#f87171" stroke-width="2"/>
  <circle cx="702" cy="234" r="20" fill="#f87171"/>
  <path d="M694 226 l16 16 M710 226 l-16 16" fill="none" stroke="#2a1418" stroke-width="4.5" stroke-linecap="round"/>
  <text x="736" y="228" class="title">Edit blocked</text>
  <text x="736" y="251" class="sub">told A holds it, moves on</text>
</svg>
