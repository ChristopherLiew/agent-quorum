name: release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Tag must match plugin.json
        run: |
          tag="${GITHUB_REF_NAME#v}"
          ver="$(jq -r .version plugin/.claude-plugin/plugin.json)"
          if [ "$tag" != "$ver" ]; then
            echo "tag v$tag does not match plugin.json version $ver" >&2
            exit 1
          fi
      - run: make check
      - run: scripts/release-build.sh "${GITHUB_REF_NAME#v}"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes --verify-tag
